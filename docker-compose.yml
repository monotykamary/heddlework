# Heddlework web workspace compose — Pi + pi-fabric over the browser client.
#
#   cp .env.example .env      # set HEDDLEWORK_HOST_ORIGINS (+ provider keys)
#   docker compose up
#
# The pairing URL prints at startup while HEDDLEWORK_HOST_PRINT_TOKEN=1.
# Provider keys live in .env (git-ignored); never commit real keys.

services:
  heddlework:
    build:
      context: .
      dockerfile: Dockerfile
    image: heddlework:latest
    restart: unless-stopped
    ports:
      - "${HEDDLEWORK_HOST_PORT:-4817}:4817"
    environment:
      # Required: exact browser origins allowed to connect (comma-separated).
      HEDDLEWORK_HOST_ORIGINS: ${HEDDLEWORK_HOST_ORIGINS:?set HEDDLEWORK_HOST_ORIGINS in .env, e.g. http://localhost:4817}
      HEDDLEWORK_HOST_PRINT_TOKEN: ${HEDDLEWORK_HOST_PRINT_TOKEN:-1}
      # Bind-mount ownership: match the host user running compose (`id -u` / `id -g`).
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      # Optional: initial provider/model for Pi.
      HEDDLEWORK_PROVIDER: ${HEDDLEWORK_PROVIDER:-}
      HEDDLEWORK_MODEL: ${HEDDLEWORK_MODEL:-}
      # Optional: point a custom OpenAI-compatible endpoint at Ollama, LM Studio,
      # vLLM, LiteLLM, or a gateway. MODEL is required with BASE_URL. Use
      # host.docker.internal on Docker Desktop, or the bridge address on Linux.
      HEDDLEWORK_OPENAI_BASE_URL: ${HEDDLEWORK_OPENAI_BASE_URL:-}
      HEDDLEWORK_OPENAI_MODEL: ${HEDDLEWORK_OPENAI_MODEL:-}
      HEDDLEWORK_OPENAI_API: ${HEDDLEWORK_OPENAI_API:-openai-completions}
      HEDDLEWORK_OPENAI_NAME: ${HEDDLEWORK_OPENAI_NAME:-custom-openai}
      HEDDLEWORK_OPENAI_KEY: ${HEDDLEWORK_OPENAI_KEY:-}
      # Optional: HTTP Basic auth, for an endpoint or proxy that asks for a
      # username and password rather than a key. Set both together; they replace
      # HEDDLEWORK_OPENAI_KEY.
      HEDDLEWORK_OPENAI_USERNAME: ${HEDDLEWORK_OPENAI_USERNAME:-}
      HEDDLEWORK_OPENAI_PASSWORD: ${HEDDLEWORK_OPENAI_PASSWORD:-}
      # The endpoint is probed at startup; warn (default here) logs a bad URL or
      # model id instead of refusing to boot, require makes it fatal, off skips.
      HEDDLEWORK_OPENAI_CHECK: ${HEDDLEWORK_OPENAI_CHECK:-warn}
      # Seconds Pi may take to answer through the endpoint (a cold local model
      # can be slower to load than the probe's own timeout).
      HEDDLEWORK_OPENAI_ANSWER_TIMEOUT: ${HEDDLEWORK_OPENAI_ANSWER_TIMEOUT:-60}
      # A tool call is proved too, since chat alone cannot drive an agent
      # session; follows HEDDLEWORK_OPENAI_CHECK unless set here.
      HEDDLEWORK_OPENAI_TOOL_CHECK: ${HEDDLEWORK_OPENAI_TOOL_CHECK:-}
      # And a whole agent turn — Pi reads a scratch file and edits it — since a
      # session that cannot carry an edit through does nothing in an editor;
      # follows HEDDLEWORK_OPENAI_TOOL_CHECK unless set here.
      HEDDLEWORK_OPENAI_AGENT_CHECK: ${HEDDLEWORK_OPENAI_AGENT_CHECK:-}
      # API keys are read by Pi at runtime; pass only what you use.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - ${HEDDLEWORK_WORKSPACE:-.}:/workspace
      - heddlework-state:/state
    working_dir: /workspace

volumes:
  heddlework-state:
