name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux/Omarchy is the primary development target: every gate runs on a
    # Linux runner against the source-built pinned runtime.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEDDLEWORK_WITHOUT_CEF: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      HEDDLEWORK_KEEP_BUILD_CACHE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang jq libfontconfig-dev libgl1-mesa-dri \
            libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev mesa-vulkan-drivers pkg-config \
            vulkan-tools wayland-protocols
      - run: bun install --frozen-lockfile
      - name: Restore matched native runtime sources and artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/heddlework-gpuix
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpuix-runtime.json', 'bun.lock') }}
      - name: Drop the published react package so setup can link the source build
        run: rm -rf node_modules/@gpuix/react
      - run: bun run setup:native
      - name: Point verification at the source-built addon
        run: |
          addon=$(find node_modules/.cache/heddlework-gpuix -type f -name 'gpuix-native.linux-x64-gnu.node' -print -quit)
          test -n "$addon"
          echo "NAPI_RS_NATIVE_LIBRARY_PATH=$addon" >> "$GITHUB_ENV"
      - name: Prove the source-built addon loads
        run: bun -e "require(process.env.NAPI_RS_NATIVE_LIBRARY_PATH); console.log('source-built addon loads')"
      - run: bun run typecheck:web
      - run: bun run build:web
      - run: bunx playwright install --with-deps chromium
      # The web paste probe depends on Chromium's clipboard/edit-command
      # behavior, which differs headless on Linux; report it without blocking
      # the lane until the web paste path normalizes bracketed wrapping.
      - run: bun run test:browser
        continue-on-error: true
      - run: bun run check
      - run: bun run check:native
      - run: bun run build
        env:
          HEDDLEWORK_WITHOUT_CEF: '1'
