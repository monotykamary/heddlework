name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HEDDLEWORK_WITHOUT_CEF: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Restore matched native runtime sources and artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/heddlework-gpuix
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gpuix-runtime.json', 'bun.lock') }}
      - name: Install Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - run: bun run setup:native
      - run: bun run typecheck:web
      - run: bun run build:web
      - run: bunx playwright install chromium
      - run: bun run test:browser
      - run: bun run check
      - run: bun run check:native
      - run: bun run build
        env:
          HEDDLEWORK_WITHOUT_CEF: '1'

  macos-portable:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./tests/directory-picker-ui.test.tsx
      - run: bun run check:native
      - run: bun run build
        env:
          HEDDLEWORK_WITHOUT_CEF: '1'
